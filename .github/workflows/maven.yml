# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install Appium
      run: npm install -g appium
    - name: Install UiAutomator2 driver
      run: appium driver install uiautomator2
    - name: Verify Appium
      run: |
        appium --version
        appium driver list --installed
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Run Android Emulator
      uses: ReactiveCircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        profile: Nexus 6
        emulator-options: -no-window -no-audio -no-boot-anim
        disable-animations: true
        script: |
          adb devices
          
          mkdir -p app
        
          curl -L -o app/CHSN.apk "https://github.com/kapiljain630/CHSNAppium/releases/download/v2.0.49/CHSN-2.0.49-release%20%281%29.apk"

          ls -lh app/CHSN.apk
          
          file app/CHSN.apk
          
          unzip -t app/CHSN.apk | head
          
          adb install -r app/CHSN.apk
        
          adb shell pm list packages | grep com.chsn
        
          appium --allow-insecure=uiautomator2:chromedriver_autodownload > appium.log 2>&1 &
        
          sleep 10
        
          curl http://127.0.0.1:4723/status
        
          mvn -B test --file pom.xml

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
