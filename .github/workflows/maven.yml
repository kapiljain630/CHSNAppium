# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    - name: Install Appium
      run: npm install -g appium
    - name: Install UiAutomator2 driver
      run: appium driver install uiautomator2
    - name: Verify Appium
      run: |
        appium --version
        appium driver list --installed
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Run Android Emulator
      uses: ReactiveCircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        profile: Nexus 6
        emulator-options: -no-window -no-audio -no-boot-anim
        disable-animations: true
        script: |
          adb devices
        
          mkdir -p app
        
          curl -L -o app/CHSN.apk "https://github.com/kapiljain630/CHSNAppium/releases/download/v2.0.49/CHSN-2.0.49-release.1.apk"
        
          adb install -r app/CHSN.apk
        
          adb shell pm list packages | grep com.chsn
        
          # Start emulator recording
          adb shell screenrecord --time-limit 180 /sdcard/emulator-test.mp4 &
          RECORD_PID=$!
        
          # Start Appium
          appium --allow-insecure=uiautomator2:chromedriver_autodownload > appium.log 2>&1 &
        
          sleep 10
        
          curl http://127.0.0.1:4723/status
        
          # Run tests
          mvn -B test --file pom.xml || touch test_failed
        
          echo "Stopping screen recording..."
        
          adb shell kill -2 $(adb shell pidof screenrecord) 2>/dev/null || true
        
          sleep 5
        
          echo "Checking recording on emulator..."
        
          adb shell ls -lh /sdcard/emulator-test.mp4 || true
        
          echo "Pulling recording..."
        
          adb pull /sdcard/emulator-test.mp4 emulator-test.mp4 || true
        
          echo "Checking recording locally..."
        
          ls -lh emulator-test.mp4 || true
        
          # Fail the step if Maven tests failed
          test ! -f test_failed
    - name: Upload emulator video
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: emulator-test-video
        path: emulator-test.mp4
        if-no-files-found: warn
        compression-level: 6
        overwrite: false
        include-hidden-files: false
